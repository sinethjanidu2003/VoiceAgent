<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenAI Realtime — Talk in Browser</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-right: 0.5rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .flow { color: #a78bfa; font-size: 0.85rem; }
    .live { color: #86efac; }
    .error { color: #f87171; }
    #log { max-height: 360px; overflow-y: auto; font-size: 0.9rem; margin-top: 0.75rem; }
    .user { color: #7dd3fc; }
    .assistant { color: #86efac; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Talk with OpenAI Realtime</h1>
  <p class="flow">Browser mic → server → OpenAI Realtime (streaming) → browser speakers</p>
  <p><a href="/">← Back to phone agent</a></p>

  <div class="card">
    <button id="connectBtn">Connect &amp; talk</button>
    <button id="stopBtn" disabled>Disconnect</button>
    <p id="status" class="flow">Click connect and allow microphone access.</p>
    <div id="log"></div>
  </div>

  <script>
    const connectBtn = document.getElementById("connectBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");
    const log = document.getElementById("log");

    const SAMPLE_RATE = 16000;
    let ws = null;
    let micStream = null;
    let micContext = null;
    let micProcessor = null;
    let playContext = null;
    let nextPlayTime = 0;

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/realtime-talk`;
    }

    function addLine(role, text) {
      const div = document.createElement("div");
      div.className = role;
      div.innerHTML = `<b>${role}:</b> ${text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function ensurePlayContext() {
      if (!playContext) playContext = new AudioContext({ sampleRate: 24000 });
      if (playContext.state === "suspended") playContext.resume();
      return playContext;
    }

    function playPcm24(arrayBuffer) {
      const ctx = ensurePlayContext();
      const int16 = new Int16Array(arrayBuffer);
      if (!int16.length) return;
      const floats = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) floats[i] = int16[i] / 32768;
      const buffer = ctx.createBuffer(1, floats.length, 24000);
      buffer.copyToChannel(floats, 0);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      const now = ctx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now;
      source.start(nextPlayTime);
      nextPlayTime += buffer.duration;
    }

    async function startMic() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      micContext = new AudioContext();
      const source = micContext.createMediaStreamSource(micStream);
      micProcessor = micContext.createScriptProcessor(4096, 1, 1);
      const ratio = micContext.sampleRate / SAMPLE_RATE;

      micProcessor.onaudioprocess = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const input = event.inputBuffer.getChannelData(0);
        const outLen = Math.floor(input.length / ratio);
        const pcm = new Int16Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const sample = input[Math.floor(i * ratio)];
          pcm[i] = Math.max(-32768, Math.min(32767, sample * 32768));
        }
        ws.send(pcm.buffer);
      };

      source.connect(micProcessor);
      micProcessor.connect(micContext.destination);
    }

    function stopMic() {
      micProcessor?.disconnect();
      micProcessor = null;
      micContext?.close();
      micContext = null;
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
    }

    function disconnect() {
      stopMic();
      if (ws) {
        ws.close();
        ws = null;
      }
      nextPlayTime = 0;
      connectBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = "Disconnected.";
      status.className = "flow";
    }

    connectBtn.onclick = async () => {
      try {
        status.textContent = "Connecting…";
        ws = new WebSocket(wsUrl());
        ws.binaryType = "arraybuffer";

        ws.onopen = async () => {
          status.textContent = "Waiting for OpenAI Realtime…";
          await startMic();
        };

        ws.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            playPcm24(event.data);
            return;
          }
          const msg = JSON.parse(event.data);
          if (msg.type === "ready") {
            status.textContent = "Connected — speak now (use headphones).";
            status.className = "live";
            connectBtn.disabled = true;
            stopBtn.disabled = false;
          } else if (msg.type === "transcript") {
            addLine(msg.role, msg.text);
          } else if (msg.type === "speech_started") {
            nextPlayTime = ensurePlayContext().currentTime;
          } else if (msg.type === "error") {
            status.textContent = msg.message;
            status.className = "error";
          }
        };

        ws.onclose = () => disconnect();
        ws.onerror = () => {
          status.textContent = "WebSocket error";
          status.className = "error";
        };
      } catch (err) {
        status.textContent = err.message;
        status.className = "error";
      }
    };

    stopBtn.onclick = () => disconnect();
  </script>
</body>
</html>
