<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk in Browser — Built-in Voice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    button { padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-right: 0.5rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select { padding: 0.4rem; font-size: 1rem; max-width: 100%; margin-top: 0.5rem; }
    .flow { color: #a78bfa; font-size: 0.85rem; }
    .live { color: #86efac; }
    .error { color: #f87171; }
    #log { max-height: 360px; overflow-y: auto; font-size: 0.9rem; margin-top: 0.75rem; }
    .user { color: #7dd3fc; }
    .assistant { color: #86efac; }
    #liveReply { color: #86efac; min-height: 1.2rem; margin-top: 0.5rem; font-style: italic; }
    a { color: #93c5fd; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
  </style>
</head>
<body>
  <h1>Talk in Browser</h1>
  <p class="flow">
    Uses your computer's <strong>built-in voice</strong> (Web Speech API) — free, no OpenAI TTS.
    <br />Mic → Whisper → ChatGPT → browser speaks the reply.
  </p>
  <p><a href="/">← Back to phone agent</a></p>

  <div class="card">
    <label for="voiceSelect">Built-in voice</label>
    <select id="voiceSelect"><option>Loading voices…</option></select>

    <br /><br />
    <button id="connectBtn">Connect &amp; talk</button>
    <button id="stopBtn" disabled>Disconnect</button>
    <p id="status" class="flow">Chrome or Edge recommended.</p>
    <div id="liveReply"></div>
    <div id="log"></div>
  </div>

  <script type="module">
    import {
      initBrowserTts,
      setBrowserVoice,
      speakBrowser,
      stopBrowserTts,
      isBrowserTtsSupported,
    } from "./browser-tts.js";

    const connectBtn = document.getElementById("connectBtn");
    const stopBtn = document.getElementById("stopBtn");
    const voiceSelect = document.getElementById("voiceSelect");
    const status = document.getElementById("status");
    const liveReply = document.getElementById("liveReply");
    const log = document.getElementById("log");

    const SAMPLE_RATE = 16000;
    let ws = null;
    let micStream = null;
    let micContext = null;
    let micProcessor = null;

    function wsUrl() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return `${proto}//${location.host}/realtime-talk`;
    }

    function addLine(role, text) {
      const div = document.createElement("div");
      div.className = role;
      div.innerHTML = `<b>${role}:</b> ${text}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function populateVoices() {
      const voices = await initBrowserTts("en");
      voiceSelect.innerHTML = voices
        .filter((v) => v.lang.startsWith("en"))
        .map((v) => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`)
        .join("");
      if (!voiceSelect.options.length) {
        voiceSelect.innerHTML = '<option value="">Default system voice</option>';
      }
    }

    voiceSelect.onchange = () => setBrowserVoice(voiceSelect.value);

    async function startMic() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      micContext = new AudioContext();
      const source = micContext.createMediaStreamSource(micStream);
      micProcessor = micContext.createScriptProcessor(4096, 1, 1);
      const ratio = micContext.sampleRate / SAMPLE_RATE;

      micProcessor.onaudioprocess = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const input = event.inputBuffer.getChannelData(0);
        const outLen = Math.floor(input.length / ratio);
        const pcm = new Int16Array(outLen);
        for (let i = 0; i < outLen; i++) {
          const sample = input[Math.floor(i * ratio)];
          pcm[i] = Math.max(-32768, Math.min(32767, sample * 32768));
        }
        ws.send(pcm.buffer);
      };

      source.connect(micProcessor);
      micProcessor.connect(micContext.destination);
    }

    function stopMic() {
      micProcessor?.disconnect();
      micProcessor = null;
      micContext?.close();
      micContext = null;
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
    }

    function disconnect() {
      stopBrowserTts();
      stopMic();
      ws?.close();
      ws = null;
      connectBtn.disabled = false;
      stopBtn.disabled = true;
      liveReply.textContent = "";
      status.textContent = "Disconnected.";
      status.className = "flow";
    }

    populateVoices();

    connectBtn.onclick = async () => {
      try {
        if (!isBrowserTtsSupported()) {
          status.textContent = "Built-in speech not supported. Use Chrome or Edge.";
          status.className = "error";
          return;
        }
        setBrowserVoice(voiceSelect.value);
        status.textContent = "Connecting…";
        ws = new WebSocket(wsUrl());

        ws.onopen = async () => {
          status.textContent = "Starting microphone…";
          await startMic();
        };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "ready") {
            status.textContent = "Connected — speak, then pause ~1.5s. Built-in voice will reply.";
            status.className = "live";
            connectBtn.disabled = true;
            stopBtn.disabled = false;
          } else if (msg.type === "transcript") {
            addLine(msg.role, msg.text);
            if (msg.role === "assistant") liveReply.textContent = "";
          } else if (msg.type === "token") {
            liveReply.textContent += msg.text;
          } else if (msg.type === "speak") {
            speakBrowser(msg.text);
          } else if (msg.type === "interrupt") {
            stopBrowserTts();
          } else if (msg.type === "error") {
            status.textContent = msg.message;
            status.className = "error";
          }
        };

        ws.onclose = () => disconnect();
        ws.onerror = () => {
          status.textContent = "WebSocket error";
          status.className = "error";
        };
      } catch (err) {
        status.textContent = err.message;
        status.className = "error";
      }
    };

    stopBtn.onclick = () => disconnect();
  </script>
</body>
</html>
