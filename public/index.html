<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Voice Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    input { padding: 0.5rem; font-size: 1rem; width: 200px; }
    button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    #log { font-size: 0.9rem; max-height: 400px; overflow-y: auto; }
    .user { color: #7dd3fc; }
    .assistant { color: #86efac; }
    .system { color: #94a3b8; font-style: italic; }
    .flow { color: #a78bfa; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Phone Voice Agent</h1>
  <p class="flow">Phone → Whisper → ChatGPT → OpenAI TTS → Phone (public OpenAI API)</p>

  <div class="card">
    <label>Call this number:</label><br /><br />
    <input id="phone" type="tel" placeholder="+15551234567" />
    <button id="callBtn">Start call</button>
    <p id="status"></p>
  </div>

  <div class="card">
    <strong>Live transcript</strong> (text from the phone call)
    <div id="log"></div>
  </div>

  <script>
    const phone = document.getElementById("phone");
    const callBtn = document.getElementById("callBtn");
    const status = document.getElementById("status");
    const log = document.getElementById("log");
    let lastCount = 0;

    callBtn.onclick = async () => {
      status.textContent = "Dialing…";
      const res = await fetch("/call", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ toPhone: phone.value }),
      });
      const data = await res.json();
      status.textContent = data.success
        ? `Call started (${data.callConnectionId})`
        : `Error: ${data.error}`;
    };

    setInterval(async () => {
      const res = await fetch("/api/transcript");
      const lines = await res.json();
      if (lines.length === lastCount) return;
      lastCount = lines.length;
      log.innerHTML = lines
        .map(
          (e) =>
            `<div class="${e.role}"><small>${e.time.slice(11, 19)}</small> ` +
            `<b>${e.role}:</b> ${e.text}</div>`
        )
        .join("");
      log.scrollTop = log.scrollHeight;
    }, 1000);
  </script>
</body>
</html>
